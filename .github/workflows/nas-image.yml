# 服务器版 Docker 镜像：推送 nas-web 分支或 nas-v* 标签时构建
# 产物：
#   1. ghcr.io/<你的用户名>/nai-studio:latest（以及按提交区分的标签）
#   2. 一个可以下载的镜像包 nai-studio-amd64.tar.gz，极空间 Docker 里可以"本地导入"
name: NAS image

on:
  push:
    branches: [nas-web]
    tags: ['nas-v*']
    paths-ignore: ['**.md', 'doc/**', 'release-notes/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nai-studio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image for local import
        run: |
          docker pull ${{ steps.meta.outputs.name }}:latest
          docker tag ${{ steps.meta.outputs.name }}:latest nai-studio:latest
          docker save nai-studio:latest | gzip > nai-studio-amd64.tar.gz
          ls -lh nai-studio-amd64.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: nai-studio-amd64
          path: nai-studio-amd64.tar.gz
          retention-days: 14
          compression-level: 0
