# 服务器版 Docker 镜像：推送 nas-web 分支或 nas-v* 标签时构建
# 产物：
#   1. ghcr.io/<你的用户名>/nai-studio:latest（以及按提交区分的标签）
#   2. 一个可以下载的镜像包 nai-studio-amd64.tar（下载得到 zip，解压即可），极空间 Docker 里可以"本地导入"
name: NAS image

on:
  push:
    branches: [nas-web]
    tags: ['nas-v*']
    paths-ignore: ['**.md', 'doc/**', 'release-notes/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Image name
        id: meta
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/nai-studio" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.meta.outputs.name }}:latest
            ${{ steps.meta.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: |
          docker pull ${{ steps.meta.outputs.name }}:latest
          mkdir -p /tmp/studio/data /tmp/studio/output
          docker run -d --name smoke -p 8960:8960 \
            -e STUDIO_PASSWORD=smoke -e STUDIO_ARCHIVE=/output \
            -v /tmp/studio/data:/data -v /tmp/studio/output:/output \
            ${{ steps.meta.outputs.name }}:latest
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8960/api/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8960/)" = 401
          curl -fs -u x:smoke http://127.0.0.1:8960/ | grep -q 'NovelAI Prompt Studio'
          curl -fs -u x:smoke -X POST -H 'X-Studio: 1' -H 'Content-Type: application/json' \
            -d '{"name":"workbench.session","input":{}}' http://127.0.0.1:8960/api/invoke | grep -q '"ok":true'
          test -f /tmp/studio/data/data/studio.sqlite
          docker logs smoke
          docker rm -f smoke

      - name: Save image for local import
        run: |
          docker tag ${{ steps.meta.outputs.name }}:latest nai-studio:latest
          docker save -o nai-studio-amd64.tar nai-studio:latest
          ls -lh nai-studio-amd64.tar

      - uses: actions/upload-artifact@v4
        with:
          name: nai-studio-amd64
          path: nai-studio-amd64.tar
          retention-days: 14
